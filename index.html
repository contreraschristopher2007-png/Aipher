<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="Asistente personal con IA Online y Offline">
  <title>Aipher</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="theme-dark">
  <a href="#appMain" class="skip-link">Saltar al contenido</a>

  <div id="appMain">
    <header class="topbar">
      <div class="topbar-brand">
        <button id="menuBtn" class="icon-btn" aria-label="Menú">☰</button>
        <div class="brand-logo" data-aipher-logo>
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <strong>Aipher</strong>
      </div>
      <div class="topbar-actions">
        <button id="engineBadge" class="engine-badge">🟢 ONLINE</button>
        <button id="appearanceBtn" class="icon-btn" aria-label="Cambiar tema">☀️</button>
        <button id="settingsBtn" class="icon-btn" aria-label="Ajustes">⚙️</button>
      </div>
    </header>

    <div class="mode-tabs">
      <button id="chatModeBtn" class="mode-tab active">💬 Chat</button>
      <button id="voiceModeBtn" class="mode-tab">🎙️ Voz</button>
    </div>

    <div id="chatMode" class="mode active">
      <div id="chatArea" class="chat-area">
        <div id="messages" class="messages"></div>
        <div id="typingIndicator" class="typing-indicator hidden">
          <div class="typing-avatar" data-aipher-logo>
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </div>
          <div class="typing-content">
            <span>Aipher está pensando</span>
            <div class="typing-dots"><i></i><i></i><i></i></div>
          </div>
        </div>
      </div>
      <div class="composer">
        <button id="attachBtn" class="composer-btn" aria-label="Adjuntar">📎</button>
        <div class="composer-input-wrap">
          <textarea id="messageInput" placeholder="Escribe un mensaje..." rows="1"></textarea>
          <span id="charCounter" class="char-counter">0/10000</span>
        </div>
        <button id="voiceBtn" class="composer-btn" aria-label="Dictar">🎙️</button>
        <button id="sendBtn" class="send-btn" aria-label="Enviar">➤</button>
      </div>
    </div>

    <div id="voiceMode" class="mode">
      <div class="voice-stage">
        <div id="voiceOrb" class="voice-orb">
          <div class="voice-orb-icon" data-aipher-logo>
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </div>
          <div class="voice-orb-rings"><span></span><span></span><span></span></div>
        </div>
        <div class="voice-info">
          <h2 id="voiceStatus">Listo para conversar</h2>
          <p id="voiceTranscript">Pulsa el micrófono para comenzar.</p>
        </div>
      </div>
      <div class="voice-controls">
        <button id="voiceStopBtn" class="voice-control" aria-label="Detener">⏹</button>
        <button id="voiceTalkBtn" class="voice-control voice-main-btn" aria-label="Hablar">🎙️</button>
        <button id="voiceMuteBtn" class="voice-control" aria-label="Silenciar">🔊</button>
      </div>
    </div>

    <div id="floatingAssistant" class="floating-assistant idle" tabindex="0" role="button" aria-pressed="false">
      <div id="bubbleLogoContainer" class="bubble-content">
        <div id="bubbleLogo" data-aipher-logo>
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
      </div>
      <img id="bubbleGifImage" class="bubble-gif hidden" alt="Aipher GIF">
      <div class="bubble-rings"><div class="ring"></div><div class="ring ring2"></div></div>
      <div id="muteIndicator" class="mute-indicator">🔇</div>
    </div>

    <div id="videoPlayer" class="video-player hidden">
      <button id="closeVideoBtn" class="video-close-btn" aria-label="Cerrar video">×</button>
      <iframe id="videoFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <aside id="sideMenu">
      <div class="panel-header">
        <div class="panel-title">
          <div class="brand-logo small" data-aipher-logo>
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </div>
          <strong>Aipher</strong>
        </div>
        <button id="closeMenuBtn" class="icon-btn" aria-label="Cerrar menú">×</button>
      </div>
      <div class="search-box">
        <span>🔎</span>
        <input id="chatSearch" type="text" placeholder="Buscar chats...">
      </div>
      <button id="newChatBtn" class="primary-btn">＋ Nuevo chat</button>
      <div id="chatList" class="chat-list"></div>
    </aside>

    <aside id="settingsPanel">
      <div class="panel-header">
        <div class="panel-title">
          <strong>⚙️ Ajustes</strong>
        </div>
        <button id="closeSettingsBtn" class="icon-btn" aria-label="Cerrar ajustes">×</button>
      </div>
      <div class="settings-list">
        <button class="setting-btn" data-section="profile">
          <span>👤</span><span><strong>Perfil</strong><small>Nombre y personalidad</small></span>
        </button>
        <button class="setting-btn" data-section="voice">
          <span>🎙️</span><span><strong>Estilo de Voz</strong><small>Kokoro y navegador</small></span>
        </button>
        <button class="setting-btn" data-section="appearance">
          <span>🎨</span><span><strong>Temas</strong><small>Grafito, Papel y más</small></span>
        </button>
        <button class="setting-btn" data-section="bubble">
          <span>🫧</span><span><strong>Burbuja</strong><small>Animación y GIF</small></span>
        </button>
        <button class="setting-btn" data-section="memory">
          <span>📚</span><span><strong>Memoria</strong><small>Lo que Aipher recuerda de ti</small></span>
        </button>
        <button class="setting-btn" data-section="engine">
          <span>🧠</span><span><strong>Motor IA</strong><small id="settingsEngineStatus">🌐 Online — Groq</small></span>
          <span id="settingsEngineIndicator" class="engine-indicator online"></span>
        </button>
        <button class="setting-btn" data-section="api">
          <span>🔑</span><span><strong>API Keys</strong><small>Groq y YouTube</small></span>
        </button>
        <button class="setting-btn" data-section="data">
          <span>💾</span><span><strong>Datos</strong><small>Importar y exportar</small></span>
        </button>
        <button class="setting-btn" data-section="about">
          <span>ℹ️</span><span><strong>Acerca de</strong><small>Aipher v4.6.0</small></span>
        </button>
      </div>
    </aside>

    <div id="modalBackdrop" class="modal-backdrop hidden">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modalTitle">Ajustes</h3>
          <button id="closeModalBtn" class="icon-btn" aria-label="Cerrar modal">×</button>
        </div>
        <div id="modalContent" class="modal-content"></div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <div id="connectionStatus" class="connection-status hidden"></div>

    <svg id="aipherLogoTemplate" class="aipher-logo-template" viewBox="0 0 24 24">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </svg>
  </div>

  <script src="app.js"></script>
</body>
</html>
