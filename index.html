<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Aipher — Asistente personal con IA Online y Offline">
<meta name="theme-color" content="#111318">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aipher</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<a class="skip-link" href="#appMain">Saltar al contenido</a>

<svg id="aipherLogoTemplate" class="aipher-logo-template" viewBox="0 0 100 100" aria-hidden="true">
<path d="M50 7C55 19 47 25 42 34C38 41 41 47 48 50C44 39 51 32 59 27C58 38 67 43 69 53C71 63 65 72 56 77C66 75 74 68 77 59C81 70 76 82 66 89C57 95 44 96 34 91C22 85 16 75 18 63C19 53 25 46 31 40C30 50 34 57 41 60C37 49 36 42 41 34C45 27 52 20 50 7Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M48 61C45 68 47 74 53 77C58 80 63 77 65 72" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
</svg>

<main id="appMain">
  <header class="topbar">
    <div class="topbar-brand">
      <button id="menuBtn" class="icon-btn" aria-label="Abrir menú">☰</button>
      <span class="brand-logo" data-aipher-logo></span>
      <strong>Aipher</strong>
    </div>
    <div class="topbar-actions">
      <button id="engineBadge" class="engine-badge">🟢 ONLINE</button>
      <button id="themeBtn" class="icon-btn" aria-label="Cambiar tema">☀️</button>
      <button id="settingsBtn" class="icon-btn" aria-label="Ajustes">⚙️</button>
    </div>
  </header>

  <nav class="mode-tabs">
    <button id="chatModeBtn" class="mode-tab active">💬 Chat</button>
    <button id="voiceModeBtn" class="mode-tab">🎙️ Voz</button>
  </nav>

  <section id="chatMode" class="mode active">
    <div id="chatArea" class="chat-area">
      <div id="messages" class="messages"></div>
      <div id="typingIndicator" class="typing-indicator hidden">
        <div class="typing-avatar" data-aipher-logo></div>
        <div class="typing-content">
          <span>Aipher está pensando</span>
          <div class="typing-dots"><i></i><i></i><i></i></div>
        </div>
      </div>
    </div>
    <div class="composer">
      <button id="attachBtn" class="composer-btn" aria-label="Adjuntar archivos">📎</button>
      <div class="composer-input-wrap">
        <textarea id="messageInput" placeholder="Escribe un mensaje..." rows="1" aria-label="Mensaje"></textarea>
        <span id="charCounter" class="char-counter">0/10000</span>
      </div>
      <button id="voiceBtn" class="composer-btn" aria-label="Dictado por voz">🎙️</button>
      <button id="sendBtn" class="send-btn" aria-label="Enviar mensaje">➤</button>
    </div>
  </section>

  <section id="voiceMode" class="mode">
    <div class="voice-stage">
      <div id="voiceOrb" class="voice-orb">
        <div class="voice-orb-rings"><span></span><span></span><span></span></div>
        <div class="voice-orb-icon" data-aipher-logo></div>
      </div>
      <div class="voice-info">
        <h2 id="voiceStatus">Listo para conversar</h2>
        <p id="voiceTranscript">Pulsa el micrófono para comenzar.</p>
      </div>
    </div>
    <div class="voice-controls">
      <button id="voiceStopBtn" class="voice-control" aria-label="Detener conversación">⏹</button>
      <button id="voiceTalkBtn" class="voice-control voice-main-btn" aria-label="Iniciar conversación">🎙️</button>
      <button id="voiceMuteBtn" class="voice-control" aria-label="Silenciar voz">🔊</button>
    </div>
  </section>
</main>

<button id="floatingAssistant" class="floating-assistant idle" aria-label="Silenciar o activar voz" aria-pressed="false">
  <span class="bubble-content">
    <span id="bubbleLogoContainer" data-aipher-logo></span>
    <img id="bubbleGifImage" class="bubble-gif hidden" alt="">
  </span>
  <span class="bubble-rings"><span class="ring"></span><span class="ring ring2"></span></span>
  <span id="muteIndicator" class="mute-indicator">🔇</span>
</button>

<div id="videoPlayer" class="video-player hidden">
  <iframe id="videoFrame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Reproductor"></iframe>
  <button id="closeVideoBtn" class="video-close-btn" aria-label="Cerrar video">×</button>
</div>

<aside id="sideMenu">
  <div class="panel-header">
    <div class="panel-title"><span class="brand-logo small" data-aipher-logo></span><strong>Aipher</strong></div>
    <button id="closeMenuBtn" class="icon-btn" aria-label="Cerrar menú">×</button>
  </div>
  <div class="search-box">🔎<input id="chatSearch" placeholder="Buscar chat..." aria-label="Buscar chat"></div>
  <div id="chatList" class="chat-list"></div>
  <div class="panel-footer"><button id="newChatBtn" class="primary-btn">＋ Nuevo chat</button></div>
</aside>

<aside id="settingsPanel">
  <div class="panel-header">
    <div class="panel-title">⚙️ <strong>Ajustes</strong></div>
    <button id="closeSettingsBtn" class="icon-btn" aria-label="Cerrar ajustes">×</button>
  </div>
  <div class="settings-list">
    <button class="setting-btn" data-section="profile"><span>👤</span><span><strong>Perfil</strong><small>Nombre y personalidad</small></span></button>
    <button class="setting-btn" data-section="voice"><span>🎙️</span><span><strong>Estilo de Voz</strong><small>Voz del dispositivo</small></span></button>
    <button id="appearanceBtn" class="setting-btn" data-section="appearance"><span>🎨</span><span><strong>Temas</strong><small>Grafito, Papel y más</small></span></button>
    <button class="setting-btn" data-section="bubble"><span>🫧</span><span><strong>Burbuja</strong><small>Animación y GIF</small></span></button>
    <button class="setting-btn" data-section="memory"><span>📚</span><span><strong>Memoria</strong><small>Lo que Aipher recuerda de ti</small></span></button>
    <button class="setting-btn" data-section="engine"><span>🧠</span><span class="setting-engine-text"><strong>Motor IA</strong><small id="settingsEngineStatus">🌐 Online — Groq</small></span><span id="settingsEngineIndicator" class="engine-indicator online"></span></button>
    <button class="setting-btn" data-section="api"><span>🔑</span><span><strong>API Keys</strong><small>Groq y YouTube</small></span></button>
    <button class="setting-btn" data-section="data"><span>💾</span><span><strong>Datos</strong><small>Importar y exportar</small></span></button>
    <button class="setting-btn" data-section="about"><span>ℹ️</span><span><strong>Acerca de</strong><small>Aipher v4.7.3</small></span></button>
  </div>
</aside>

<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button id="closeModalBtn" class="icon-btn" aria-label="Cerrar">×</button>
    </div>
    <div id="modalContent" class="modal-content"></div>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>
<div id="connectionStatus" class="connection-status hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.7.2/mammoth.browser.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
